<!doctype html>
<html lang="en" class="is-locked">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mehedi &amp; Lamia · 16 December 2026</title>
  <meta name="description" content="You are cordially invited to the wedding of Mehedi Hasan &amp; Tasmim Afroj Lamia on Wednesday, 16 December 2026 at The Royal Garden, Dhaka.">
  <meta name="theme-color" content="#1c0508">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mehedi &amp; Lamia · 16 December 2026">
  <meta property="og:description" content="You are cordially invited. Wednesday, 16 December 2026 · The Royal Garden, Dhaka.">
  <meta property="og:url" content="https://mehediwedslamia.github.io/">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Anek+Bangla:wght@300;400;500&family=Atma:wght@400;500;600&family=Jost:wght@400;500&family=Pinyon+Script&display=swap">
  <link rel="stylesheet" href="css/style.css?v=32">
</head>
<body>

  <!-- Fixed controls -->
  <button class="tassel" id="menuBtn" type="button" aria-controls="menu" aria-expanded="false">
    <svg class="tassel__art" viewBox="0 0 40 150" aria-hidden="true">
      <defs>
        <linearGradient id="tasselGold" x1="0" x2="1">
          <stop offset="0" stop-color="#8a6332"/>
          <stop offset=".45" stop-color="#f1d89f"/>
          <stop offset="1" stop-color="#9c7543"/>
        </linearGradient>
      </defs>
      <line x1="20" y1="0" x2="20" y2="88" stroke="#c9a66b" stroke-width="1.4" stroke-dasharray="2 2"/>
      <circle cx="20" cy="92" r="5" fill="url(#tasselGold)"/>
      <path d="M13 98 Q20 94 27 98 L28 108 Q20 111 12 108 Z" fill="url(#tasselGold)"/>
      <rect x="11" y="107" width="18" height="3" rx="1.5" fill="#f1d89f"/>
      <g stroke="url(#tasselGold)" stroke-width="1.2" stroke-linecap="round">
        <path d="M12 110 L10 146"/><path d="M14 110 L13 147"/><path d="M16 110 L16 148"/>
        <path d="M18 110 L18 148"/><path d="M20 110 L20 149"/><path d="M22 110 L22 148"/>
        <path d="M24 110 L24 148"/><path d="M26 110 L27 147"/><path d="M28 110 L30 146"/>
      </g>
    </svg>
    <span class="tassel__label" data-i18n="ui.menu">Menu</span>
  </button>

  <div class="controls">
    <button class="pill-btn" id="langBtn" type="button"></button>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="true">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M16 9.5l5 5M21 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Menu -->
  <nav class="menu" id="menu" aria-hidden="true">
    <button class="icon-btn menu__close" id="menuClose" type="button" data-i18n-aria="ui.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    </button>
    <div class="menu__seal seal-art" data-size="small"></div>
    <ol class="menu__list" id="menuList"></ol>
  </nav>

  <div class="petals" aria-hidden="true"></div>

  <main>
    <!-- ============ HERO / INVITATION ============ -->
    <section class="hero" id="invitation" data-dark>
      <div class="curtain" aria-hidden="true">
        <svg class="curtain__valance" width="100%" height="64">
          <defs>
            <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4f0b17"/>
              <stop offset=".55" stop-color="#a3233a"/>
              <stop offset="1" stop-color="#6f1424"/>
            </linearGradient>
            <radialGradient id="velvetSheen" cx="50%" cy="20%" r="60%">
              <stop offset="0" stop-color="#ff8a9a" stop-opacity=".22"/>
              <stop offset="1" stop-color="#ff8a9a" stop-opacity="0"/>
            </radialGradient>
            <pattern id="scallops" width="120" height="64" patternUnits="userSpaceOnUse">
              <path d="M0 0H120V30C104 30 92 58 60 58S16 30 0 30Z" fill="url(#velvet)"/>
              <path d="M0 0H120V30C104 30 92 58 60 58S16 30 0 30Z" fill="url(#velvetSheen)"/>
              <path d="M0 30C16 30 28 58 60 58S104 30 120 30" fill="none" stroke="#e8c987" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0 4.6"/>
              <circle cx="0" cy="31" r="2.6" fill="#e8c987"/>
              <circle cx="120" cy="31" r="2.6" fill="#e8c987"/>
            </pattern>
          </defs>
          <rect width="100%" height="64" fill="url(#scallops)"/>
        </svg>
        <div class="curtain__rod"></div>
      </div>

      <!-- Envelope (covers the screen until opened) -->
      <div class="envelope" id="envelope">
        <div class="flap flap--left"><div class="flap__face"></div></div>
        <div class="flap flap--right"><div class="flap__face"></div></div>
        <div class="flap flap--bottom"><div class="flap__face"></div></div>
        <div class="flap flap--top"><div class="flap__face"></div></div>

        <div class="envelope__intro">
          <p class="eyebrow eyebrow--gold" data-i18n="ui.invited"></p>
          <p class="envelope__names" data-i18n="envelope.names" data-amp></p>
          <p class="envelope__date" data-i18n="envelope.date"></p>
        </div>

        <button class="seal" id="seal" type="button" data-i18n-aria="ui.open">
          <span class="seal-art"></span>
        </button>
        <p class="envelope__tap" data-i18n="ui.tap"></p>
      </div>

      <!-- The card revealed after opening -->
      <div class="card-wrap">
        <article class="card">
          <div class="card__body">
            <svg class="card__floral" viewBox="0 0 260 44" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
                <path d="M112 24C96 12 80 34 60 24S34 16 18 22"/>
                <path d="M148 24C164 12 180 34 200 24S226 16 242 22"/>
                <path d="M86 23c-2-9-11-11-15-7 5 1 10 4 15 7z"/>
                <path d="M64 25c3 7 11 9 15 5-5-1-10-3-15-5z"/>
                <path d="M174 23c2-9 11-11 15-7-5 1-10 4-15 7z"/>
                <path d="M196 25c-3 7-11 9-15 5 5-1 10-3 15-5z"/>
                <path d="M40 20c-1-6-7-8-10-5 4 1 7 3 10 5z"/>
                <path d="M220 20c1-6 7-8 10-5-4 1-7 3-10 5z"/>
              </g>
              <g fill="currentColor" opacity=".9">
                <ellipse cx="130" cy="13" rx="4" ry="8"/>
                <ellipse cx="130" cy="13" rx="4" ry="8" transform="rotate(72 130 22)"/>
                <ellipse cx="130" cy="13" rx="4" ry="8" transform="rotate(144 130 22)"/>
                <ellipse cx="130" cy="13" rx="4" ry="8" transform="rotate(216 130 22)"/>
                <ellipse cx="130" cy="13" rx="4" ry="8" transform="rotate(288 130 22)"/>
              </g>
              <circle cx="130" cy="22" r="3.2" fill="#f4ead8" stroke="currentColor"/>
              <g fill="currentColor"><circle cx="100" cy="17" r="1.6"/><circle cx="160" cy="17" r="1.6"/><circle cx="50" cy="28" r="1.4"/><circle cx="210" cy="28" r="1.4"/></g>
            </svg>

            <div class="card__panel">
              <p class="card__families" data-i18n="card.families"></p>
              <h1 class="card__names">
                <span data-i18n="card.groom"></span>
                <span class="card__amp" data-i18n="card.and"></span>
                <span data-i18n="card.bride"></span>
              </h1>
              <p class="card__request" data-i18n="card.request"></p>

              <svg class="divider" viewBox="0 0 200 14" aria-hidden="true">
                <line x1="20" y1="7" x2="88" y2="7"/><line x1="112" y1="7" x2="180" y2="7"/>
                <path d="M100 1l6 6-6 6-6-6z"/><circle cx="100" cy="7" r="1.6"/>
              </svg>

              <div class="card__date">
                <span class="card__side" data-i18n="card.weekday"></span>
                <span class="card__day" data-i18n="card.day"></span>
                <span class="card__side" data-i18n="card.month"></span>
              </div>
              <p class="card__bangla" lang="bn" data-i18n="card.banglaDate"></p>
              <p class="card__time" data-i18n="card.time"></p>
              <p class="card__venue">
                <span data-i18n="card.venue"></span>
                <span class="card__city" data-i18n="card.city"></span>
              </p>
            </div>
          </div>
        </article>
      </div>

      <a class="scroll-cue" href="#countdown">
        <span data-i18n="ui.scroll"></span>
        <span class="scroll-cue__line" aria-hidden="true"></span>
      </a>
    </section>

    <!-- ============ COUNTDOWN ============ -->
    <section class="section section--blush" id="countdown">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="countdown.eyebrow"></p>
          <h2 class="section-title" data-i18n="countdown.title"></h2>
        </header>
        <div class="countdown reveal" id="countdownGrid">
          <div class="countdown__cell"><span class="countdown__num" data-unit="days">00</span><span class="countdown__label" data-i18n="countdown.days"></span></div>
          <div class="countdown__cell"><span class="countdown__num" data-unit="hours">00</span><span class="countdown__label" data-i18n="countdown.hours"></span></div>
          <div class="countdown__cell"><span class="countdown__num" data-unit="minutes">00</span><span class="countdown__label" data-i18n="countdown.minutes"></span></div>
          <div class="countdown__cell"><span class="countdown__num" data-unit="seconds">00</span><span class="countdown__label" data-i18n="countdown.seconds"></span></div>
        </div>
        <p class="countdown__done" id="countdownDone" data-i18n="countdown.done" hidden></p>
        <p class="countdown__when reveal" data-i18n="countdown.when"></p>
      </div>
    </section>

    <!-- ============ STORY ============ -->
    <section class="section section--cream section--story" id="story">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="story.eyebrow"></p>
          <h2 class="section-title" data-i18n="story.title"></h2>
          <svg class="ornament" viewBox="0 0 160 14" aria-hidden="true"><line x1="0" y1="7" x2="64" y2="7"/><line x1="96" y1="7" x2="160" y2="7"/><path d="M80 1c3 3 3 9 0 12-3-3-3-9 0-12zM70 7c3-3 9-3 10 0-1 3-7 3-10 0zM90 7c-3-3-9-3-10 0 1 3 7 3 10 0z"/></svg>
        </header>
        <div class="story">
          <div class="story__body reveal" id="storyBody"></div>
          <ol class="timeline" id="storyTimeline"></ol>
        </div>
        <blockquote class="quote reveal">
          <p class="quote__original" lang="bn" data-i18n="story.quoteOriginal"></p>
          <p data-i18n="story.quote"></p>
          <cite data-i18n="story.quoteBy"></cite>
        </blockquote>
      </div>
    </section>

    <!-- ============ EVENTS ============ -->
    <section class="section section--blush" id="events">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="events.eyebrow"></p>
          <h2 class="section-title" data-i18n="events.title"></h2>
        </header>
        <div class="events" id="eventsList"></div>
      </div>
    </section>

    <!-- ============ SCHEDULE ============ -->
    <section class="section section--maroon" id="schedule" data-dark>
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow eyebrow--gold" data-i18n="schedule.eyebrow"></p>
          <h2 class="section-title section-title--light" data-i18n="schedule.title"></h2>
        </header>
        <ol class="schedule" id="scheduleList"></ol>
        <p class="schedule__note reveal" data-i18n="schedule.note"></p>
      </div>
    </section>

    <!-- ============ VENUE ============ -->
    <section class="section section--cream" id="venue">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="venue.eyebrow"></p>
          <h2 class="section-title" data-i18n="venue.title"></h2>
        </header>
        <div class="venue">
          <div class="venue__info reveal">
            <p class="venue__name" data-i18n="venue.name"></p>
            <p class="venue__address" data-i18n="venue.address"></p>
            <p class="venue__when" data-i18n="venue.when"></p>
            <div class="venue__actions">
              <a class="btn btn--solid" id="directionsLink" target="_blank" rel="noopener">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="9.8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                <span data-i18n="venue.directions"></span>
              </a>
              <a class="btn btn--ghost" id="facebookLink" target="_blank" rel="noopener">
                <span data-i18n="venue.facebook"></span>
              </a>
            </div>
          </div>
          <div class="venue__map reveal">
            <iframe id="mapFrame" title="Map to The Royal Garden" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ GALLERY ============ -->
    <section class="section section--blush" id="gallery">
      <div class="container">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="gallery.eyebrow"></p>
          <h2 class="section-title" data-i18n="gallery.title"></h2>
        </header>
        <div class="gallery" id="galleryGrid"></div>
      </div>
    </section>

    <!-- ============ FAQ ============ -->
    <section class="section section--cream" id="faq">
      <div class="container container--narrow">
        <header class="section-head reveal">
          <p class="eyebrow" data-i18n="faq.eyebrow"></p>
          <h2 class="section-title" data-i18n="faq.title" data-amp></h2>
        </header>
        <div class="faq" id="faqList"></div>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer" data-dark>
    <div class="footer__seal seal-art" data-size="small"></div>
    <p class="footer__line" data-i18n="footer.line"></p>
    <p class="footer__love" data-i18n="footer.withLove"></p>
    <p class="footer__names" data-i18n="footer.names" data-amp></p>
    <p class="footer__date" data-i18n="footer.date"></p>
    <a class="footer__top" href="#invitation" data-i18n="ui.backToTop"></a>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <img alt="">
  </div>

  <script src="js/content.js?v=32"></script>
  <script src="js/main.js?v=32"></script>
</body>
</html>
